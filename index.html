<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jira Status Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="h-full font-sans overflow-hidden">

  <!-- 🔒 LOGIN SCREEN -->
  <div id="loginScreen" class="fixed inset-0 bg-slate-950 flex flex-col items-center justify-center z-[100]">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-xl shadow-2xl max-w-sm w-full">
      <div class="text-center mb-6">
        <span class="bg-amber-500 text-slate-950 px-3 py-1 rounded-lg font-bold text-sm tracking-wide">Jira Workspace</span>
        <h2 class="text-2xl font-semibold mt-4 text-slate-100">Welcome Back</h2>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Email</label>
          <input type="email" id="loginEmail" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-amber-500 text-slate-100">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Password</label>
          <input type="password" id="loginPassword" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-amber-500 text-slate-100" onkeypress="if(event.key === 'Enter') handleLogin()">
        </div>
        <p id="loginError" class="text-red-500 text-xs hidden text-center font-medium"></p>
        <button onclick="handleLogin()" id="loginBtn" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 py-2.5 rounded-lg text-sm font-bold shadow-lg transition-colors mt-2">Sign In</button>
      </div>
    </div>
  </div>

  <!-- 🚀 MAIN APP WORKSPACE -->
  <div id="appWorkspace" class="hidden h-full flex flex-col">
    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900 px-6 py-4 flex items-center justify-between z-10 shadow-sm">
      <div class="flex items-center space-x-3">
        <div class="bg-amber-500 text-slate-950 p-2 rounded-lg font-bold text-sm">Jira</div>
        <h1 class="text-xl font-semibold tracking-tight text-slate-200">Tracker Workspace</h1>
      </div>
      <div class="flex items-center space-x-4">
        <button onclick="toggleSidebar()" class="bg-slate-800 border border-slate-700 p-2 rounded-lg text-slate-400 hover:text-slate-200 hover:border-amber-500 transition-colors" title="Toggle Sidebar">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"></path></svg>
        </button>
        <button onclick="openNewTicketModal()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-lg">+ New Ticket</button>
        <button onclick="handleLogout()" class="text-slate-400 hover:text-slate-200 text-sm font-medium transition-colors">Sign Out</button>
      </div>
    </header>

    <!-- Main Split-Screen Container -->
    <div class="flex-1 flex overflow-hidden">
      
      <!-- Left Sidebar -->
      <aside id="sidebar" class="w-[26rem] shrink-0 border-r border-slate-800 bg-slate-900/50 flex flex-col transition-all duration-300">
        <div class="flex overflow-x-auto border-b border-slate-800 bg-slate-900 text-xs no-scrollbar">
          <button onclick="setTab('Ongoing', 'tab-ongoing')" id="tab-ongoing" class="px-4 py-3 font-semibold border-b-2 border-amber-500 text-amber-500 whitespace-nowrap transition-colors">Ongoing</button>
          <button onclick="setTab('Parked Dev', 'tab-parkeddev')" id="tab-parkeddev" class="px-4 py-3 font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 whitespace-nowrap transition-colors">Parked Dev</button>
          <button onclick="setTab('Parked', 'tab-parked')" id="tab-parked" class="px-4 py-3 font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 whitespace-nowrap transition-colors">Parked</button>
          <button onclick="setTab('Finished', 'tab-finished')" id="tab-finished" class="px-4 py-3 font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 whitespace-nowrap transition-colors">Finished</button>
        </div>
        <div class="p-4 border-b border-slate-800 flex flex-col gap-2">
          <input type="text" id="searchBar" placeholder="Search Jiras..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500 text-slate-200 shadow-inner">
          <div class="flex items-center gap-2 text-xs">
            <span class="text-slate-500 font-semibold uppercase tracking-wider">Sort:</span>
            <select id="sortSelect" onchange="changeSort(this.value)" class="bg-slate-900 border border-slate-700 rounded-md px-2 py-1 text-slate-300 focus:outline-none focus:border-amber-500">
              <option value="last_updated">Last Updated</option>
              <option value="priority">Priority</option>
              <option value="due_date">Due Date</option>
              <option value="alpha">Alphabetical</option>
            </select>
          </div>
        </div>
        <div id="ticketList" class="flex-1 overflow-y-auto divide-y divide-slate-800/60">
          <p class="text-slate-500 text-sm p-4 text-center">Loading tickets...</p>
        </div>
      </aside>

      <!-- Right Workspace -->
      <main id="workspace" class="flex-1 flex flex-col bg-slate-950 overflow-hidden relative">
        <div class="flex-1 flex items-center justify-center text-slate-500 p-8 text-center">
          <p>Select a Jira ticket from a folder on the left to view its timeline.</p>
        </div>
      </main>
    </div>
  </div>

  <!-- MODAL: Add Ticket -->
  <div id="newTicketModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-xl max-w-xl w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
      <h3 class="text-lg font-medium text-slate-200 mb-4">Add New Jira Ticket</h3>
      <div class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Jira ID(s) <span class="normal-case opacity-70">(comma separated)</span></label>
            <input type="text" id="newJiraId" placeholder="OPPR-10515, OPPR-10516" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500 text-slate-100">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Jira Link(s) <span class="normal-case opacity-70">(comma separated)</span></label>
            <input type="text" id="newTicketLink" placeholder="https://..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500 text-slate-100">
          </div>
        </div>
        
        <div class="grid grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Priority</label>
            <select id="newPriority" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500 text-slate-100">
              <option value="High">High</option>
              <option value="Medium" selected>Medium</option>
              <option value="Low">Low</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Alert Days</label>
            <input type="number" id="newFreq" value="7" min="1" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500 text-slate-100">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Due Date</label>
            <input type="date" id="newDueDate" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500 text-slate-100" style="color-scheme: dark;">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Subject</label>
          <input type="text" id="newSubject" placeholder="Brief subject" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500 text-slate-100">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Summary / Details</label>
          <textarea id="newSummary" rows="2" placeholder="Full summary of the issue..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500 text-slate-100 resize-none"></textarea>
        </div>
        
        <hr class="border-slate-800 my-2">
        
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Shelf Title</label>
            <input type="text" id="newShelfTitle" placeholder="e.g., Q3 Analytics" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500 text-slate-100">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Shelf Link</label>
            <input type="url" id="newShelfLink" placeholder="https://..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500 text-slate-100">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Remarks</label>
          <input type="text" id="newRemark" placeholder="Any quick remarks?" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500 text-slate-100">
        </div>
      </div>
      <div class="flex justify-end space-x-3 mt-6">
        <button onclick="closeNewTicketModal()" class="px-4 py-2 text-sm font-medium text-slate-400 hover:text-slate-200">Cancel</button>
        <button onclick="createNewTicket()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-4 py-2 rounded-lg text-sm font-bold shadow-lg">Save Ticket</button>
      </div>
    </div>
  </div>

  <!-- MODAL: EDIT TICKET -->
  <div id="editTicketModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-xl max-w-xl w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-medium text-slate-200">Edit Ticket Details</h3>
        <button onclick="deleteTicket()" class="bg-red-500/10 text-red-500 border border-red-500/20 hover:bg-red-500/20 px-3 py-1.5 rounded text-xs font-bold transition-colors">🗑️ Delete Ticket</button>
      </div>
      <div class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Jira ID(s)</label>
            <input type="text" id="editJiraId" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-amber-500 text-slate-100">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Jira Link(s)</label>
            <input type="text" id="editTicketLink" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-amber-500 text-slate-100">
          </div>
        </div>
        
        <div class="grid grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Priority</label>
            <select id="editPriority" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-amber-500 text-slate-100">
              <option value="High">High</option>
              <option value="Medium">Medium</option>
              <option value="Low">Low</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Alert Days</label>
            <input type="number" id="editFreq" min="1" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-amber-500 text-slate-100">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Due Date</label>
            <input type="date" id="editDueDate" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-amber-500 text-slate-100" style="color-scheme: dark;">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Subject</label>
          <input type="text" id="editSubject" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-amber-500 text-slate-100">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Summary / Details</label>
          <textarea id="editSummary" rows="2" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-amber-500 text-slate-100 resize-none"></textarea>
        </div>
        
        <hr class="border-slate-800 my-2">
        
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Shelf Title</label>
            <input type="text" id="editShelfTitle" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-amber-500 text-slate-100">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Shelf Link</label>
            <input type="url" id="editShelfLink" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-amber-500 text-slate-100">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Remarks</label>
          <input type="text" id="editRemark" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-amber-500 text-slate-100">
        </div>
      </div>
      <div class="flex justify-end space-x-3 mt-6">
        <button onclick="closeEditTicketModal()" class="px-4 py-2 text-sm font-medium text-slate-400 hover:text-slate-200">Cancel</button>
        <button onclick="saveTicketEdits()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-4 py-2 rounded-lg text-sm font-bold shadow-lg">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- MODAL: Edit Note -->
  <div id="editNoteModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-xl max-w-2xl w-full p-6 shadow-2xl">
      <h3 class="text-lg font-medium text-slate-200 mb-4">Edit Note</h3>
      <textarea id="editNoteText" rows="5" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500 text-slate-100 shadow-inner resize-none"></textarea>
      <div class="flex justify-end space-x-3 mt-4">
        <button onclick="closeEditNoteModal()" class="px-4 py-2 text-sm font-medium text-slate-400 hover:text-slate-200">Cancel</button>
        <button onclick="saveEditedNote()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-4 py-2 rounded-lg text-sm font-bold shadow-lg">Update Note</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://jikqrfseacrrekpolbsa.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imppa3FyZnNlYWNycmVrcG9sYnNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNTMzMjMsImV4cCI6MjA5NTYyOTMyM30.Ca-4IFwgmQG2ePn0Sg6hb2txskW7qtAqRWSoPz99vXc"; 
    let dbClient = null;

    let allTickets = [];
    let currentTab = 'Ongoing';
    let currentSort = 'last_updated';
    const STATUS_MAP = {
      'Ongoing': ['Waiting Reply', 'Waiting reply', 'In progress'],
      'Parked Dev': ['Jira Parked Dev'],
      'Parked': ['Jira Parked'],
      'Finished': ['Jira Done', 'Jira Closed']
    };

    let currentEditNoteId = null;
    let currentOpenTicketId = null;
    let sidebarOpen = true;

    // --- AUTHENTICATION LOGIC ---
    async function checkSession() {
      const { data: { session } } = await dbClient.auth.getSession();
      if (session) showApp(); else showLogin();
    }

    async function handleLogin() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const errorText = document.getElementById('loginError');
      const btn = document.getElementById('loginBtn');
      if (!email || !password) return;
      btn.innerText = "Signing in...";
      errorText.classList.add('hidden');
      const { data, error } = await dbClient.auth.signInWithPassword({ email, password });
      if (error) { errorText.innerText = error.message; errorText.classList.remove('hidden'); btn.innerText = "Sign In"; } 
      else { document.getElementById('loginEmail').value = ''; document.getElementById('loginPassword').value = ''; btn.innerText = "Sign In"; showApp(); }
    }

    async function handleLogout() { await dbClient.auth.signOut(); showLogin(); }
    function showApp() { document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('appWorkspace').classList.remove('hidden'); fetchTickets(); }
    function showLogin() { document.getElementById('appWorkspace').classList.add('hidden'); document.getElementById('loginScreen').classList.remove('hidden'); }

    // --- UI HELPERS ---
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebarOpen = !sidebarOpen;
      sidebar.classList.toggle('hidden', !sidebarOpen);
      sidebar.classList.toggle('w-[26rem]', sidebarOpen);
      sidebar.classList.toggle('w-0', !sidebarOpen);
      sidebar.classList.toggle('border-r', sidebarOpen);
    }
    
    // --- CLIPBOARD IMAGE PASTE LOGIC ---
    function handleImagePaste(e) {
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (let index in items) {
        const item = items[index];
        if (item.kind === 'file' && item.type.includes('image/')) {
          e.preventDefault();
          const blob = item.getAsFile();
          const reader = new FileReader();
          reader.onload = function(event) {
            const base64 = event.target.result;
            const txt = e.target;
            // Inject img tag at cursor
            txt.value = txt.value.substring(0, txt.selectionStart) + `\n<img src="${base64}" class="max-w-md rounded-lg mt-2 border border-slate-700">\n` + txt.value.substring(txt.selectionEnd);
          };
          reader.readAsDataURL(blob);
        }
      }
    }

    // --- MODALS ---
    function openNewTicketModal() { document.getElementById('newTicketModal').classList.remove('hidden'); }
    function closeNewTicketModal() { document.getElementById('newTicketModal').classList.add('hidden'); }
    
    function openEditTicketModal() {
      const t = allTickets.find(tick => tick.id === currentOpenTicketId);
      if(!t) return;
      document.getElementById('editJiraId').value = t.jira_id || '';
      document.getElementById('editTicketLink').value = t.ticket_link || '';
      document.getElementById('editPriority').value = t.priority || 'Medium';
      document.getElementById('editFreq').value = t.update_frequency_days || 7;
      document.getElementById('editDueDate').value = t.due_date || '';
      document.getElementById('editSubject').value = t.subject || '';
      document.getElementById('editSummary').value = t.summary || '';
      document.getElementById('editShelfTitle').value = t.shelf_title || '';
      document.getElementById('editShelfLink').value = t.shelf_link || '';
      document.getElementById('editRemark').value = t.remark || '';
      document.getElementById('editTicketModal').classList.remove('hidden');
    }
    function closeEditTicketModal() { document.getElementById('editTicketModal').classList.add('hidden'); }

    function openEditNoteModal(noteId, encodedText) { currentEditNoteId = noteId; document.getElementById('editNoteText').value = decodeURIComponent(encodedText); document.getElementById('editNoteModal').classList.remove('hidden'); }
    function closeEditNoteModal() { document.getElementById('editNoteModal').classList.add('hidden'); }

    document.getElementById('searchBar').addEventListener('input', renderTickets);
    function changeSort(val) { currentSort = val; renderTickets(); }

    function setTab(tabName, tabId) {
      currentTab = tabName;
      ['tab-ongoing', 'tab-parkeddev', 'tab-parked', 'tab-finished'].forEach(id => {
        const el = document.getElementById(id);
        if(id === tabId) { el.classList.add('border-amber-500', 'text-amber-500'); el.classList.remove('border-transparent', 'text-slate-400'); } 
        else { el.classList.remove('border-amber-500', 'text-amber-500'); el.classList.add('border-transparent', 'text-slate-400'); }
      });
      renderTickets();
    }

    async function fetchTickets() {
      if (!dbClient) return;
      const { data, error } = await dbClient.from('tickets').select('*');
      if (error) { console.error(error.message); return; }
      allTickets = data || [];
      renderTickets();
    }

    function renderTickets() {
      const list = document.getElementById('ticketList');
      const searchTerm = document.getElementById('searchBar').value.toLowerCase();
      
      let filtered = allTickets.filter(t => {
        const status = t.status || 'Waiting Reply'; 
        const searchString = `${t.jira_id} ${t.subject || ''} ${t.summary || ''} ${t.shelf_title || ''}`.toLowerCase();
        return STATUS_MAP[currentTab].includes(status) && searchString.includes(searchTerm);
      });

      // Sorting Logic
      filtered.sort((a, b) => {
        if (currentSort === 'last_updated') return new Date(b.last_updated || 0) - new Date(a.last_updated || 0);
        if (currentSort === 'alpha') return (a.jira_id || '').localeCompare(b.jira_id || '');
        if (currentSort === 'priority') {
          const p = { 'High': 3, 'Medium': 2, 'Low': 1 };
          return (p[b.priority] || 2) - (p[a.priority] || 2);
        }
        if (currentSort === 'due_date') {
          if(!a.due_date) return 1; if(!b.due_date) return -1;
          return new Date(a.due_date) - new Date(b.due_date);
        }
        return 0;
      });

      if (filtered.length === 0) { list.innerHTML = `<p class="text-slate-500 text-sm p-4 text-center">No tickets found.</p>`; return; }
      const now = new Date(); 

      list.innerHTML = filtered.map(t => {
        let badgeColor = "bg-slate-800 text-slate-400 border-slate-700";
        if(t.status === 'Waiting Reply' || t.status === 'Waiting reply') badgeColor = "bg-amber-500/10 text-amber-500 border-amber-500/20";
        if(t.status === 'In progress') badgeColor = "bg-blue-500/10 text-blue-400 border-blue-500/20";
        if(t.status === 'Jira Done' || t.status === 'Jira Closed') badgeColor = "bg-emerald-500/10 text-emerald-400 border-emerald-500/20";

        let prioBorder = 'border-transparent hover:border-amber-500';
        if (t.priority === 'High') prioBorder = 'border-red-500/80 hover:border-red-400';
        if (t.priority === 'Low') prioBorder = 'border-blue-500/80 hover:border-blue-400';

        const isFinished = t.status === 'Jira Done' || t.status === 'Jira Closed';
        const freqDays = t.update_frequency_days || 7;
        const needsUpdate = ((now - new Date(t.last_updated)) / (1000 * 60 * 60 * 24)) > freqDays && !isFinished;

        let dueBadgeHtml = '';
        if (t.due_date && !isFinished) {
          const daysToDue = (new Date(t.due_date) - now) / (1000 * 60 * 60 * 24);
          if (daysToDue < 0) dueBadgeHtml = `<span class="text-[10px] font-bold uppercase tracking-wider text-red-400 bg-red-500/10 px-2 py-1 rounded border border-red-500/20">Overdue</span>`;
          else if (daysToDue <= 2) dueBadgeHtml = `<span class="text-[10px] font-bold uppercase tracking-wider text-amber-400 bg-amber-500/10 px-2 py-1 rounded border border-amber-500/20">Due Soon</span>`;
        }

        return `
        <div onclick="openTicket('${t.id}')" class="ticket-item p-4 hover:bg-slate-800 cursor-pointer transition-colors border-l-4 ${prioBorder} relative">
          <div class="flex justify-between items-start mb-1">
            <span class="text-slate-100 font-bold text-sm tracking-wide line-clamp-1 mr-2">${t.jira_id}</span>
            <span class="text-[10px] uppercase font-bold text-slate-500 mt-1 whitespace-nowrap">Last update: ${new Date(t.last_updated).toLocaleDateString()}</span>
          </div>
          ${t.subject ? `<p class="text-slate-300 text-sm font-semibold truncate mb-1">${t.subject}</p>` : ''}
          <div class="flex justify-between items-center mt-2">
            <span class="inline-block px-2.5 py-1 text-[11px] font-bold uppercase rounded border ${badgeColor}">${t.status || 'Waiting Reply'}</span>
            <div class="flex gap-1">
              ${dueBadgeHtml}
              ${needsUpdate ? `<span class="text-[10px] font-bold uppercase tracking-wider text-red-400 bg-red-500/10 px-2 py-1 rounded border border-red-500/20">Update (${freqDays}d)</span>` : ''}
            </div>
          </div>
        </div>
      `}).join('');
    }

    async function createNewTicket() {
      const insertData = {
        jira_id: document.getElementById('newJiraId').value,
        subject: document.getElementById('newSubject').value,
        summary: document.getElementById('newSummary').value,
        ticket_link: document.getElementById('newTicketLink').value,
        shelf_title: document.getElementById('newShelfTitle').value,
        shelf_link: document.getElementById('newShelfLink').value,
        remark: document.getElementById('newRemark').value,
        priority: document.getElementById('newPriority').value,
        update_frequency_days: parseInt(document.getElementById('newFreq').value) || 7,
        due_date: document.getElementById('newDueDate').value || null,
        status: 'Waiting Reply'
      };
      if(!insertData.jira_id) return alert("Jira ID is required!");
      
      const { error } = await dbClient.from('tickets').insert([insertData]);
      if(error) { alert("Error: " + error.message); } else {
        closeNewTicketModal();
        ['newJiraId', 'newSubject', 'newSummary', 'newTicketLink', 'newShelfTitle', 'newShelfLink', 'newRemark', 'newDueDate'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('newPriority').value = 'Medium'; document.getElementById('newFreq').value = '7';
        setTab('Ongoing', 'tab-ongoing'); fetchTickets(); 
      }
    }

    async function saveTicketEdits() {
      const updateData = {
        jira_id: document.getElementById('editJiraId').value,
        subject: document.getElementById('editSubject').value,
        summary: document.getElementById('editSummary').value,
        ticket_link: document.getElementById('editTicketLink').value,
        shelf_title: document.getElementById('editShelfTitle').value,
        shelf_link: document.getElementById('editShelfLink').value,
        remark: document.getElementById('editRemark').value,
        priority: document.getElementById('editPriority').value,
        update_frequency_days: parseInt(document.getElementById('editFreq').value) || 7,
        due_date: document.getElementById('editDueDate').value || null,
      };
      const { error } = await dbClient.from('tickets').update(updateData).eq('id', currentOpenTicketId);
      if(error) { alert("Error: " + error.message); } else {
        closeEditTicketModal(); fetchTickets(); openTicket(currentOpenTicketId);
      }
    }

    async function deleteTicket() {
      if(!confirm("⚠️ Are you sure you want to PERMANENTLY delete this ticket and all its notes?")) return;
      await dbClient.from('ticket_updates').delete().eq('ticket_id', currentOpenTicketId);
      await dbClient.from('tickets').delete().eq('id', currentOpenTicketId);
      closeEditTicketModal();
      document.getElementById('workspace').innerHTML = `<div class="flex-1 flex items-center justify-center text-slate-500"><p>Ticket deleted successfully.</p></div>`;
      fetchTickets();
    }

    function toggleReplyBox(id) {
      document.getElementById(`replyBox-${id}`).classList.toggle('hidden');
    }

    async function submitReply(noteId) {
      const replyVal = document.getElementById(`replyText-${noteId}`).value;
      if(!replyVal.trim()) return;
      
      const { data } = await dbClient.from('ticket_updates').select('content').eq('id', noteId).single();
      // Append visually threaded blockquote 
      const newContent = data.content + `\n\n<div class="pl-4 border-l-2 border-emerald-500/50 mt-3 text-slate-300"><span class="text-emerald-500 text-[10px] font-bold uppercase tracking-wider block mb-1">↳ Reply Thread</span>${replyVal}</div>`;
      
      await dbClient.from('ticket_updates').update({ content: newContent }).eq('id', noteId);
      openTicket(currentOpenTicketId);
    }

    async function openTicket(id) {
      currentOpenTicketId = id;
      const workspace = document.getElementById('workspace');
      workspace.innerHTML = `<div class="flex-1 flex items-center justify-center"><p class="text-amber-500 animate-pulse">Loading workspace...</p></div>`;

      const { data: ticket } = await dbClient.from('tickets').select('*').eq('id', id).single();
      const { data: updates } = await dbClient.from('ticket_updates').select('*').eq('ticket_id', id).order('created_at', { ascending: true });

      const statusOptions = ['Waiting Reply', 'In progress', 'Jira Parked Dev', 'Jira Parked', 'Jira Done', 'Jira Closed'];
      
      let updatesHtml = updates.length === 0 
        ? `<div class="flex-1 flex items-center justify-center text-slate-600 italic">No notes yet.</div>` 
        : `<div class="space-y-4">` + updates.map(u => `
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl group relative">
              <div class="flex justify-between items-center mb-3">
                <div class="text-xs font-bold uppercase tracking-wider text-slate-500">${new Date(u.created_at).toLocaleString()}</div>
                <div class="opacity-0 group-hover:opacity-100 transition-opacity space-x-3">
                  <button onclick="toggleReplyBox('${u.id}')" class="text-xs text-emerald-400 hover:text-emerald-300">Reply</button>
                  <button onclick="openEditNoteModal('${u.id}', '${encodeURIComponent(u.content || '')}')" class="text-xs text-blue-400 hover:text-blue-300">Edit</button>
                  <button onclick="deleteNote('${u.id}')" class="text-xs text-red-500 hover:text-red-400">Delete</button>
                </div>
              </div>
              <div class="text-slate-200 text-sm whitespace-pre-wrap leading-relaxed prose prose-invert max-w-none">${u.content}</div>
              
              <!-- Hidden Reply Thread Box -->
              <div id="replyBox-${u.id}" class="hidden mt-4 pl-4 border-l-2 border-slate-700">
                <textarea id="replyText-${u.id}" rows="2" placeholder="Type a reply to this thread..." class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-sm text-slate-100 focus:outline-none focus:border-amber-500 resize-none"></textarea>
                <div class="flex justify-end mt-2">
                  <button onclick="submitReply('${u.id}')" class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-3 py-1.5 rounded text-xs font-bold hover:bg-emerald-500/30 transition-colors">Submit Reply</button>
                </div>
              </div>
            </div>
          `).join('') + `</div>`;

      // Handle Multiple Jira Links
      const jiraIds = (ticket.jira_id || '').split(',').map(s=>s.trim());
      const ticketLinks = (ticket.ticket_link || '').split(',').map(s=>s.trim());
      
      const headerDisplay = jiraIds.map((jid, idx) => {
         if (ticketLinks[idx]) return `<a href="${ticketLinks[idx]}" target="_blank" class="hover:text-blue-400 hover:underline mr-3 inline-flex items-center gap-1">${jid} ↗</a>`;
         return `<span class="mr-3 inline-block">${jid}</span>`;
      }).join('');

      // Build Shelf UI
      let shelfHtml = '';
      if(ticket.shelf_title || ticket.shelf_link || ticket.remark) {
        shelfHtml = `<div class="bg-slate-800/50 border border-slate-700/50 rounded-lg p-3 mt-4 flex items-center gap-4 text-sm">
          ${ticket.shelf_title ? `<div><span class="text-slate-500 text-xs uppercase font-bold mr-2">Shelf:</span><a href="${ticket.shelf_link || '#'}" target="_blank" class="text-blue-400 hover:underline font-semibold">${ticket.shelf_title}</a></div>` : ''}
          ${ticket.remark ? `<div class="border-l border-slate-700 pl-4"><span class="text-slate-500 text-xs uppercase font-bold mr-2">Remark:</span><span class="text-slate-300">${ticket.remark}</span></div>` : ''}
        </div>`;
      }

      workspace.innerHTML = `
        <div class="flex flex-col h-full w-full">
          <div class="p-6 border-b border-slate-800 bg-slate-900 flex justify-between items-start">
            <div class="max-w-3xl flex-1 pr-6">
              <div class="flex flex-wrap items-center gap-3 mb-2">
                <h2 class="text-2xl font-bold text-slate-100 flex flex-wrap items-center">${headerDisplay}</h2>
                <span class="px-2 py-0.5 rounded text-xs font-bold border ${ticket.priority === 'High' ? 'bg-red-500/10 text-red-400 border-red-500/20' : (ticket.priority === 'Low' ? 'bg-blue-500/10 text-blue-400 border-blue-500/20' : 'bg-amber-500/10 text-amber-500 border-amber-500/20')}">${ticket.priority || 'Medium'} Prio</span>
                ${ticket.due_date ? `<span class="px-2 py-0.5 rounded text-xs font-bold border bg-slate-800 text-slate-300 border-slate-700">Due: ${new Date(ticket.due_date).toLocaleDateString()}</span>` : ''}
              </div>
              ${ticket.subject ? `<h3 class="text-lg font-semibold text-slate-200 mb-2">${ticket.subject}</h3>` : ''}
              ${ticket.summary ? `<div class="bg-slate-950/50 p-3 rounded border border-slate-800 text-slate-400 text-sm italic mb-2">${ticket.summary}</div>` : ''}
              ${shelfHtml}
            </div>
            <div class="flex items-center space-x-3 shrink-0">
              <button onclick="openEditTicketModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-3 py-2 rounded-lg text-sm transition-colors font-medium">✏️ Edit Ticket</button>
              <select onchange="updateStatus('${id}', this.value)" class="bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-sm font-medium text-slate-200 focus:outline-none focus:border-amber-500">
                ${statusOptions.map(s => `<option value="${s}" ${ticket.status === s ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
            </div>
          </div>
          
          <div class="flex-1 overflow-y-auto p-6 bg-slate-950/50">
            ${updatesHtml}
          </div>

          <div class="p-6 border-t border-slate-800 bg-slate-900">
            <div class="flex items-center justify-between mb-2">
               <span class="text-xs text-slate-500 italic">💡 Tip: You can paste (Ctrl+V) images directly into the text box below!</span>
            </div>
            <textarea id="newUpdateText" rows="3" placeholder="Type your notes here..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500 text-slate-100 mb-3 resize-none"></textarea>
            <div class="flex justify-end">
              <button onclick="addUpdate('${id}')" id="postBtn" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-6 py-2.5 rounded-lg text-sm font-bold shadow-lg">Post Update</button>
            </div>
          </div>
        </div>
      `;

      // Attach Paste Listener for Images
      document.getElementById('newUpdateText').addEventListener('paste', handleImagePaste);
    }

    async function addUpdate(ticketId) {
      const text = document.getElementById('newUpdateText').value;
      if (!text.trim()) return;
      const { error } = await dbClient.from('ticket_updates').insert([{ ticket_id: ticketId, content: text }]);
      if (error) { alert("Error saving note: " + error.message); return; }
      await dbClient.from('tickets').update({ last_updated: new Date().toISOString() }).eq('id', ticketId);
      openTicket(ticketId); fetchTickets(); 
    }

    async function saveEditedNote() {
      const newText = document.getElementById('editNoteText').value;
      await dbClient.from('ticket_updates').update({ content: newText }).eq('id', currentEditNoteId);
      closeEditNoteModal(); openTicket(currentOpenTicketId);
    }
    
    async function deleteNote(noteId) { if(confirm("Delete this note?")) { await dbClient.from('ticket_updates').delete().eq('id', noteId); openTicket(currentOpenTicketId); } }
    async function updateStatus(ticketId, newStatus) { await dbClient.from('tickets').update({ status: newStatus, last_updated: new Date().toISOString() }).eq('id', ticketId); fetchTickets(); }

    window.onload = () => {
      if(SUPABASE_ANON_KEY) {
        dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        dbClient.auth.onAuthStateChange((event, session) => { if (event === 'SIGNED_IN') showApp(); if (event === 'SIGNED_OUT') showLogin(); });
        checkSession();
      }
    };
  </script>
</body>
</html>
